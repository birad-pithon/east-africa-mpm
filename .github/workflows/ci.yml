name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt -r requirements.txt
          pip install -e ".[dev,bayes]" ruff

      # Name the offending package instead of dumping resolver internals if a
      # pin ever becomes unsatisfiable again. landsatxplore (which needs
      # shapely<2, impossible beside geopandas' shapely>=2) used to sit in the
      # core set, and every CI run died in the step above without reaching the
      # linter or the tests.
      - name: Environment is self-consistent (pip check)
        run: python -m pip check

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests
        run: pytest tests -q --no-header
