# 13) OGC web map services - DLR EOC (view / reconnaissance layers)
#
# Evaluated 2026-09-22 against all three belt AOIs.  The EOC *imagery*
# service (the reviewed capabilities document) proved unusable for this
# project: 19 of its 28 layers are Germany/Europe-only and its global
# layers (EnMAP L0 quicklooks) render empty tiles.  The sibling EOC *land*
# service does render real data over East Africa and is registered below.
# WMS returns colour-stretched renderings, not digital numbers, so these
# layers are context / QA / mask screening only - they never enter the
# feature matrix.  Helper: src.ingest.dlr_eoc_wms.

  # -- DLR EOC Imagery Map Service (evaluated: no usable data layer) --
  dlr_eoc_imagery_wms:
    layer: "Multispectral imagery"
    purpose: "Orthoimagery map service (Sentinel-2 MAJA + WASP mosaics, MODIS-EU, RapidEye Germany 2015, EnMAP L0 quicklooks, S2 tile grid). Evaluated 2026-09-22: no usable data layer over the East Africa belts - see evaluation_note."
    provider: "DLR Earth Observation Center (EOC) GeoService"
    access: "wms"
    classification: "public (Fees NONE, AccessConstraints NONE)"
    url: "https://geoservice.dlr.de/eoc/imagery/wms"
    capabilities_url: "https://geoservice.dlr.de/eoc/imagery/wms?service=WMS&version=1.3.0&request=GetCapabilities"
    format: "OGC WMS 1.3.0 (image/png, image/geotiff) + GetFeatureInfo"
    crs: ["EPSG:3857", "EPSG:4326", "CRS:84"]
    n_layers: 28
    verified_layers:
      - name: "S2_TILE_GRID"
        style: "s2-tile-grid"
        verdict: "usable - reference grid only (Sentinel-2 tiling scheme)"
      - name: "ENMAP_HSI_L0_QL_FOOTPRINTS"
        style: "enmap-l0-ql-footprints"
        verdict: "empty - 100% transparent tile on every window tested; GetFeatureInfo returns numberReturned=0"
      - name: "ENMAP_HSI_L0_QL_SWIR"
        style: "enmap-l0-ql-swir"
        verdict: "empty - 100% transparent tile (no EnMAP quicklook over the belts)"
    evaluation_note: "19 of 28 layers are Germany/Europe only: S2 L2A MAJA (FRE/SRE/CLM/MG2) and L3A WASP over Germany, MODIS-EU (bbox starts 27.7N), MODIS Germany mosaic, RapidEye RESA Germany 2015, 3K Brunswick aerial. The only global layers are the nine EnMAP HSI L0 quicklooks and S2_TILE_GRID; all EnMAP quicklook renders came back fully transparent including a Germany control, i.e. the service exposes no EnMAP quicklook data via WMS."
    verification_module: "src.ingest.dlr_eoc_wms"
    verified_on: "2026-09-22"
    commodities: [all]
    status: "pending"

  # -- DLR EOC Land Map Service (verified usable context layers) --
  dlr_eoc_land_wms:
    layer: "Multispectral imagery"
    purpose: "Context / screening layers over East Africa: SoilSuite bare-surface reflectance composite (Africa, 4-year), TanDEM-X FNF 50 m forest mask, WSF 2019 + Evolution settlement masks, GUF 28 m urban footprint, ESA-CCI land-ocean mask, TimeScan Landsat 2015 composite, Natural Earth countries."
    provider: "DLR Earth Observation Center (EOC) GeoService"
    access: "wms"
    classification: "public (Fees NONE, AccessConstraints NONE; GUF mosaic non-commercial use only)"
    url: "https://geoservice.dlr.de/eoc/land/wms"
    capabilities_url: "https://geoservice.dlr.de/eoc/land/wms?service=WMS&version=1.3.0&request=GetCapabilities"
    format: "OGC WMS 1.3.0 (image/png) + GetFeatureInfo"
    crs: ["EPSG:3857", "EPSG:4326", "CRS:84"]
    n_layers: 141
    ingest: "src.ingest.dlr_eoc_wms"
    cli: "python -m src.ingest.dlr_eoc_wms --list | --belt bauxite"
    verified_layers:
      - name: "SOILSUITE_SRC_AFR_P4Y"
        style: "soilsuite-src-afr-p4y-fin"
        verdict: "usable - Karagwe 63% opaque, Usambara 28%; no render over the Copperbelt (product extent starts 28.75E / 7.22S)"
      - name: "SOILSUITE_SRC-CI95_AFR_P4Y"
        style: "soilsuite-src-ci95-afr-p4y-fin"
        verdict: "usable - confidence companion, Karagwe + Usambara"
      - name: "SOILSUITE_SRC-STD_AFR_P4Y"
        style: "soilsuite-src-std-afr-p4y-fin"
        verdict: "usable - temporal variability of the bare-surface composite"
      - name: "SOILSUITE_SFREQ-BSF_AFR_P4Y"
        style: "soilsuite-sfreq-bsf-afr-p4y-fin"
        verdict: "usable - bare-surface frequency (exposure mask), Karagwe + Usambara 100% opaque"
      - name: "TDM_FNF50"
        style: "fnf"
        verdict: "usable - all three belts, 100% opaque, 4 classes (forest mask)"
      - name: "WSF_2019"
        style: "wsf2019"
        verdict: "usable - all three belts (settlement / disturbance mask)"
      - name: "WSF_Evolution"
        style: "wsfevolution"
        verdict: "usable - global extent, sparse over the belts"
      - name: "GUF28_DLR_v1_Mosaic"
        style: "guf_8bit"
        verdict: "usable - coarse urban context (very sparse over rural belts)"
      - name: "ESA_LAND_OCEAN_MAP"
        style: "oceanmask"
        verdict: "usable - global land/water mask"
      - name: "TS_LANDSAT_2015"
        style: "timescan-standard"
        verdict: "usable - all three belts, Landsat median composite for independent QA"
      - name: "ne_countries"
        style: ""
        verdict: "usable - global country boundaries"
    limitations: "WMS returns 8-bit colour-stretched tiles, not DN / reflectance values, so these layers are context, QA and mask screening only and never enter the feature matrix. Request GetMap in EPSG:3857 or CRS:84; oversized windows on some layers reply with a ServiceExceptionReport. Radiometric hyperspectral ingest remains EnMAP L2A via src.ingest.enmap."
    verification_module: "src.ingest.dlr_eoc_wms"
    verified_on: "2026-09-22"
    commodities: [all]
    status: "configured"

