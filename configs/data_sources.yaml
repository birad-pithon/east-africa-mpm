# Master data-source registry for the East Africa MPM pipeline.
#
# Single source of truth describing every data layer consumed by the
# pipeline: purpose, provider, access method, format, commodities, status.
#
# access:
#   download         - automated pull (HTTP / Earth Engine / API)
#   direct-request   - must be requested from the agency; no public bulk URL
#   portal           - interactive portal / cadastre; manual export then
#                      register via src.ingest.national_surveys.register_local_data
#   manual           - from published papers or reports
#   wms              - OGC web map service (rendered tiles for view / QA;
#                      not radiometric values for feature mining)
#
# status:
#   configured       - ingestion script implemented + endpoint verified
#   pending-url      - script implemented, endpoint to configure
#   request-required - no public bulk access - contact the provider
#   pending          - planned

grid:
  crs: "EPSG:32736"        # UTM Zone 36S (Rwanda / Karagwe-Ankole Belt)
  resolution_m: 30         # matches SRTM / Landsat / Sentinel-2

sources:

  # 1) Regional geological maps - lithology & structural base layer
  usgs_worldgeol:
    layer: "Regional geological maps"
    purpose: "Lithology polygons + geological contacts (production base layer)"
    provider: "USGS / Geological Survey of Canada - General geologic map of the world (Open File 2915d, ~1:35M)"
    access: "download"
    classification: "public"
    format: "WFS 1.1.0 (GML) -> GeoPackage"
    wfs_url: "https://mrdata.usgs.gov/services/wfs/worldgeol"
    layers: [geology, contacts]
    ingest: "src.ingest.worldgeol"
    features: "src.features.geology_features"
    commodities: [all]
    status: "configured"

  brgm_africa_geology:
    layer: "Regional geological maps"
    purpose: "Continental lithology & structure base layer"
    provider: "BRGM / CGMW - Geological map of Africa at 1:10,000,000"
    access: "download"
    classification: "public"
    format: "GIS package / shapefile-zip"
    url: null
    url_candidates:
      - "https://geobru.brgm.fr"
      - "https://www.sigafrique.net"
    commodities: [all]
    status: "pending-url"

  rmb_geology:
    layer: "Regional geological maps"
    purpose: "National lithology & structure (high resolution)"
    provider: "Rwanda Mines, Petroleum & Gas Board (RMB)"
    access: "direct-request"
    contact_url: "https://www.rmb.gov.rw"
    format: "shapefile / geodatabase / GeoPackage"
    commodities: [sn, w, ta]
    status: "request-required"

  gst_geology:
    layer: "Regional geological maps"
    purpose: "National lithology & structure"
    provider: "Tanzania Geological Survey (GST)"
    access: "direct-request"
    contact_url: "https://www.gst.go.tz"
    format: "shapefile / geodatabase"
    commodities: [ba, sn, w, ta]
    status: "request-required"

  cami_geology:
    layer: "Regional geological maps"
    purpose: "National lithology & structure (DRC Copperbelt)"
    provider: "DRC CAMU / CAMI"
    access: "direct-request"
    contact_url: "https://cami.cd"
    format: "shapefile / geodatabase"
    commodities: [cu, zn]
    status: "request-required"

  dgsm_geology:
    layer: "Regional geological maps"
    purpose: "National lithology & structure"
    provider: "Uganda Directorate of Geological Survey and Mines (DGSM)"
    access: "direct-request"
    contact_url: "https://dgsm.go.ug"
    format: "shapefile / geodatabase"
    commodities: [sn, w, ta]
    status: "request-required"

  rmb_geology_50k:
    layer: "Regional geological maps"
    purpose: "Rwanda 1:50k sheet-by-sheet upgrade (RMB/RMCA programme): digitised
      lithology from new field transects, archived observation points and
      reinterpreted airborne geophysics. Karongi sheet published; request the
      sheets covering Gatumba / Musha / Nyakabingo first."
    provider: "Rwanda Mines, Petroleum & Gas Board (RMB) + Royal Museum for
      Central Africa (RMCA)"
    access: "direct-request"
    contact_url: "https://www.rmb.gov.rw"
    format: "shapefile / geodatabase (per 1:50k sheet)"
    commodities: [sn, w, ta]
    notes: "supersedes rmb_geology 1:100k polygons sheet-by-sheet"
    status: "request-required"

  rmb_geophysics:
    layer: "Regional geophysics"
    purpose: "Reinterpreted 1980s airborne magnetic / radiometric anomalies:
      granitic intrusive bodies + deep-seated structural magnetic anomalies
      (the layer closest to pegmatite-belt detection)."
    provider: "RMB / RMCA (digitised survey archive)"
    access: "direct-request"
    contact_url: "https://www.rmb.gov.rw"
    format: "raster / vector anomaly lines"
    commodities: [sn, w, ta]
    status: "request-required"

  rmb_pta:
    layer: "Priority Target Areas"
    purpose: "RMB's own annual desktop-study targets - expert soft positives
      independent of this model (ingest via src.labels.pta)."
    provider: "RMB (legally required annual publication)"
    access: "direct-request"
    contact_url: "https://www.rmb.gov.rw"
    format: "point / polygon layer (pdf table acceptable)"
    commodities: [all]
    ingest: "src.labels.pta"
    status: "request-required"

  rmb_gimcs_licenses:
    layer: "Cadastral / licence boundaries"
    purpose: "Active exploration / mining / quarry licence polygons from the
      Geological Information and Mining Cadastre System (GIMCS) external
      portal - occupied 3T licences as mineralisation proxies
      (ingest via src.labels.licenses)."
    provider: "RMB GIMCS external portal"
    access: "portal"
    contact_url: "https://www.rmb.gov.rw"
    format: "shapefile / GeoJSON"
    commodities: [sn, w, ta, all]
    ingest: "src.labels.licenses"
    status: "request-required"

  rmca_archive_2020:
    layer: "Archival geo-data"
    purpose: "2020 RMCA transfer to RMB (2x14 TB): colonial-era and private
      company geo-data predating the published 1:50k sheets; may hold finer
      detail than anything public. Request sampling of the KAB-relevant
      holdings, not bulk transfer."
    provider: "Royal Museum for Central Africa (Tervuren) via RMB"
    access: "direct-request"
    contact_url: "https://www.africamuseum.be"
    format: "scanned maps / reports / vectorisations"
    commodities: [sn, w, ta]
    status: "request-required"
# 2) Known deposit / occurrence points - positive labels
  usgs_mrds:
    layer: "Known deposits / occurrences"
    purpose: "Positive training labels"
    provider: "USGS Mineral Resources Data System (MRDS)"
    access: "download"
    classification: "public"
    url: "https://mrdata.usgs.gov/mrds/mrds-trim.zip"
    wfs_url: "https://mrdata.usgs.gov/services/wfs/mrds"
    format: "shapefile (point)"
    commodities: [sn, w, ta, cu, zn, ba]
    ingest: "src.ingest.usgs_africa"
    status: "configured"

  usgs_africa_compilation:
    layer: "Known deposits / occurrences + infrastructure"
    purpose: "Comprehensive mineral-industry geodatabase for Africa"
    provider: "USGS - Compilation of Geospatial Data for Mineral Industries and Related Infrastructure of Africa"
    access: "download"
    classification: "public"
    format: "ESRI File Geodatabase / shapefile-zip"
    url: ""
    commodities: [all]
    status: "pending-url"

  deposit_papers:
    layer: "Known deposits / occurrences"
    purpose: "Rich attributes (grades, genesis) from published studies"
    provider: "Deposit-genesis papers (Karagwe-Ankole tungsten-tin studies)"
    access: "manual"
    classification: "academic"
    format: "tables / geocoded references"
    commodities: [sn, w, ta, cu, zn]
    status: "manual"

  # 3) Aeromagnetic & gravity surveys
  emag_magnetic:
    layer: "Aeromagnetic & gravity surveys"
    purpose: "Structural/intrusion detection for Sn-W-Ta veins and Cu-Zn traps"
    provider: "NCEI EMAG2v3 Earth Magnetic Anomaly Grid (2 arc-min, global)"
    access: "download"
    classification: "public"
    format: "GeoTIFF / netCDF"
    url: "https://www.ncei.noaa.gov/products/earth-magnetic-anomaly-grid"
    commodities: [sn, w, ta, cu, zn]
    status: "pending-url"

  wgm_gravity:
    layer: "Aeromagnetic & gravity surveys"
    purpose: "Crustal structure / basin geometry for Cu-Zn traps"
    provider: "BGI WGM2012 World Gravity Map (Bouguer / isostatic)"
    access: "download"
    classification: "public"
    format: "GeoTIFF / netCDF"
    url: "https://bgi.obs-mip.fr"
    commodities: [cu, zn]
    status: "pending-url"

  airborne_report_data:
    layer: "Aeromagnetic & gravity surveys"
    purpose: "High-resolution local anomalies from NI 43-101 / JORC filings"
    provider: "Operators (Ivanhoe, Lindian, Trinity Metals) via technical reports"
    access: "manual"
    classification: "published"
    format: "PDF figures / XY grids (manual parsing)"
    commodities: [sn, w, ta, cu, zn]
    status: "manual"
# 4) Multispectral / hyperspectral imagery
  sentinel2:
    layer: "Multispectral imagery"
    purpose: "Laterite & alteration mapping; clay/iron oxide indices"
    provider: "ESA Copernicus Sentinel-2 (Surface Reflectance)"
    access: "download"
    classification: "public"
    ee_collection: "COPERNICUS/S2_SR_HARMONIZED"
    format: "GeoTIFF"
    commodities: [ba, sn, w, ta]
    status: "configured"

  landsat:
    layer: "Multispectral imagery"
    purpose: "Broad-scale alteration / iron-hydroxide mapping (long archive)"
    provider: "USGS Landsat 8/9 (EarthExplorer)"
    access: "portal"
    classification: "public"
    ee_collection: "LANDSAT/LC08/C02/T1_L2"
    format: "GeoTIFF"
    commodities: [ba, cu, zn]
    status: "pending-url"

  aster:
    layer: "Multispectral imagery"
    purpose: "Shortwave / thermal bands for laterite & alteration"
    provider: "NASA ASTER archive (EarthExplorer)"
    access: "portal"
    classification: "public"
    ee_collection: "ASTER/AST_L1T_003"
    format: "GeoTIFF"
    commodities: [ba, cu, zn]
    status: "pending"

  # 5) Digital elevation model
  srtm_dem:
    layer: "Digital elevation model"
    purpose: "Plateau geomorphology (bauxite), structural lineaments"
    provider: "SRTM 30 m (USGS)"
    access: "download"
    classification: "public"
    ee_collection: "USGS/SRTMGL1_003"
    format: "GeoTIFF"
    commodities: [ba, all]
    status: "configured"

  glo30_dem:
    layer: "Digital elevation model"
    purpose: "Higher-accuracy Copernicus GLO-30 DEM alternative"
    provider: "Copernicus GLO-30"
    access: "download"
    classification: "public"
    ee_collection: "COPERNICUS/DEM/GLO30"
    format: "GeoTIFF"
    commodities: [all]
    status: "configured"
# 6) Stream sediment / soil geochemistry
  survey_geochem:
    layer: "Stream sediment / soil geochemistry"
    purpose: "Cu-Zn-Sn anomaly detection surfaces"
    provider: "National survey geochemical databases (validated)"
    access: "direct-request"
    format: "point CSV / geodatabase"
    commodities: [cu, zn, sn]
    status: "request-required"

  report_geochem:
    layer: "Stream sediment / soil geochemistry"
    purpose: "Anomaly surfaces from historical exploration reports"
    provider: "Historical exploration company reports"
    access: "manual"
    format: "PDF / tables (manual digitisation)"
    commodities: [cu, zn, sn]
    status: "manual"

  # 7) Cadastral / licence boundaries
  cami_cadastre:
    layer: "Cadastral / licence boundaries"
    purpose: "Exclude licensed ground; identify open acreage"
    provider: "DRC CAMU cadastre portal"
    access: "portal"
    contact_url: "https://cami.cd"
    format: "shapefile / GeoJSON"
    commodities: [all]
    status: "pending"

  tmc_tanzania_licenses:
    layer: "Cadastral / licence boundaries"
    purpose: "Tanzania mining / exploration licences"
    provider: "Tanzania Mining Commission"
    access: "portal"
    contact_url: "https://www.tmc.go.tz"
    format: "shapefile"
    commodities: [ba, sn, w, ta]
    status: "pending"

  rmb_licenses:
    layer: "Cadastral / licence boundaries"
    purpose: "Rwanda exploration / mining licences"
    provider: "Rwanda RMB licence registry"
    access: "portal"
    contact_url: "https://www.rmb.gov.rw"
    format: "shapefile"
    commodities: [sn, w, ta]
    status: "pending"

# 8) Satellite / Earth observation access portals (bulk entry)
# ── USGS EarthExplorer ────────────────────────────────────────────────
  earthexplorer:
    layer: "Satellite imagery portal"
    purpose: "Landsat 8/9 (OLI/TIRS, 30 m), SRTM DEM (30 m), ASTER GDEM (30 m), Landsat legacy archive - browse + download for 7-country AOI"
    provider: "USGS / NASA - EarthExplorer"
    access: "portal"
    classification: "public"
    url: "https://earthexplorer.usgs.gov/"
    format: "GeoTIFF (bulk download), MTK, zipped"
    commodities: [all]
    status: "configured"
    ee_collection: null   # portal-only; mirror: USGS/SRTMGL1_003 via EE

    # ── NASA Earthdata Search ─────────────────────────────────────────────
  earthdata_search:
    layer: "Satellite imagery portal"
    purpose: "Harmonized Landsat-Sentinel (HLS, 30 m), MODIS/VIIRS, SMAP, GEDI canopy height, ASTER, LP-DaAC products - NE Africa coverage"
    provider: "NASA Earthdata Search / DAAC network"
    access: "portal"
    classification: "public"
    url: "https://earthdata.nasa.gov/"
    format: "GeoTIFF / netCDF / HDF (download), OGC WCS/WMS (subset)"
    commodities: [all]
    status: "configured"

    # ── Copernicus Data Space Ecosystem ───────────────────────────────────
  copernicus_dse:
    layer: "Satellite imagery portal"
    purpose: "Sentinel-1 SAR (10 m), Sentinel-2 MSI (10/20 m), Sentinel-3 OLCI/SLSTR, Copernicus DEM (GLO-30/GLO-90), legacy SciHub - free open access"
    provider: "ESA / EU Copernicus - Data Space Ecosystem"
    access: "download"
    classification: "public"
    url: "https://dataspace.copernicus.eu/"
    format: "SAFE / JPEG2000 / COG (Phenix), OData API"
    commodities: [all]
    status: "configured"

    # ── NASA ASF Vertex (SAR + DEM) ───────────────────────────────────────
  asf_vertex:
    layer: "Satellite imagery / DEM portal"
    purpose: "ALOS PALSAR 12.5 m DEM (global), Sentinel-1 SAR, InSAR interferograms - structural lineament extraction in East Africa"
    provider: "NASA ASF DAAC (Alaska Satellite Facility)"
    access: "portal"
    classification: "public"
    url: "https://vertex.daac.asf.alaska.edu/"
    format: "GeoTIFF (ALOS DEM), SAR products (KMZ/GeoTIFF)"
    commodities: [sn, w, ta, cu, zn]  # structural proxies
    status: "configured"

  # ── EnMAP hyperspectral (German DLR) ──────────────────────────────────
  enmap_hyperspectral:
    layer: "Hyperspectral imagery"
    purpose: "224-band VNIR+SWIR cube (420-2450 nm, 30 m, ~30 km swath) - resolves the 2.20 um Al-OH (muscovite/kaolinite/gibbsite) from the 2.33 um Mg-OH/CO3 (chlorite/epidote/carbonate) uptake that Sentinel-2 B12 cannot separate. Feeds src.ingest.enmap + src.features.hyperspectral band-depth / SAM analysis."
    provider: "DLR (German Aerospace Center) - Environmental Mapping and Analysis Program"
    access: "portal"
    classification: "public (free scientific use, registration required)"
    url: "https://www.enmap.org/"
    order_url: "https://eoweb.dlr.de/"
    processing_tools:
      - "EnPT Python package (atmospheric correction, destriping)"
      - "EnMAP-Box QGIS plugin (spectral analysis)"
    targeted_acquisition: "on-demand via Foreground Mission Campaign planning (https://www.enmap.org/foreground-mission)"
    ingest: "src.ingest.enmap (align_to_grid CLI)"
    features: "src.features.hyperspectral (band_depth @ 2200/2330/900 nm, spectral_angle_mapper)"
    format: "GeoTIFF L2A reflectance (DN x 1e4, auto-scaled); ENVI available"
    products: "L0 / L1B (radiance) / L1C (TOA reflectance) / L2A (BOA reflectance)"
    commodities: [sn, w, ta, cu, zn, ba, au, gemstones]
    status: "configured"   # ingest + feature modules implemented; scenes ordered per-belt
    notes: "SWIR striping near water bands - use EnPT >=1.4.0 along-track destriping. On-demand targeting recommended over the Karagwe-Ankole, Copperbelt and Usambara AOIs."

  # ── PRISMA hyperspectral (Italian ASI) ────────────────────────────────
  prisma_hyperspectral:
    layer: "Hyperspectral imagery"
    purpose: "EnMAP-class alternative hyperspectral cube (VNIR+SWIR, 30 m, 30 km swath) - cross-validation of EnMAP mineral anomalies and fill for acquisition gaps"
    provider: "ASI (Italian Space Agency) - PRISMA / PRISMA Second Generation"
    access: "portal"
    classification: "public (free research use, registration required)"
    url: "https://prisma.asi.it/"
    ingest: "src.ingest.enmap (same cube loader - wavelength-parsed band descriptions)"
    format: "GeoTIFF / HDF5 (L2D BOA reflectance)"
    commodities: [sn, w, ta, cu, zn, ba, au, gemstones]
    status: "pending"   # same ingest path as EnMAP; portal account required

